<svg xmlns="http://www.w3.org/2000/svg" width="1082" height="544" viewBox="0 0 1082 544"><rect width="1082" height="544" fill="#f0f3f6"/><g font-family="Malgun Gothic, sans-serif"><text x="42" y="47" font-size="17" fill="#345064">WORKFLOW / 업무를 맡기는 순서</text><g class="flow-node" data-label="새로운업무절차에서긴제목을공백없이사용하는경우"><rect x="40" y="95" width="222" height="372" rx="7" fill="white" stroke="#b8c7d2"/><text data-role="number" x="62" y="135" font-size="17" fill="#05507d">01</text><text data-role="title" x="62" y="179" font-size="25" font-weight="700" fill="#182e3d">새로운업무절</text><text data-role="title" x="62" y="213" font-size="25" font-weight="700" fill="#182e3d">차에서긴제목</text><text data-role="title" x="62" y="247" font-size="25" font-weight="700" fill="#182e3d">을공백없이사</text><text data-role="title" x="62" y="281" font-size="25" font-weight="700" fill="#182e3d">용하는경우</text><text data-role="subtitle" x="62" y="385" font-size="17" fill="#52616c">긴 부가 설명도 영역</text><text data-role="subtitle" x="62" y="409" font-size="17" fill="#52616c">안에서 자동으로</text><text data-role="subtitle" x="62" y="433" font-size="17" fill="#52616c">줄바꿈되어야 합니다</text></g><path d="M270 281.0h22m-7-7 7 7-7 7" fill="none" stroke="#4b6b82" stroke-width="2"/><g class="flow-node" data-label="DOWNLOAD_AND_VERIFY_THE_LATEST_APPROVED_SOURCE_DOCUMENT"><rect x="300" y="95" width="222" height="372" rx="7" fill="white" stroke="#b8c7d2"/><text data-role="number" x="322" y="135" font-size="17" fill="#05507d">02</text><text data-role="title" x="322" y="179" font-size="25" font-weight="700" fill="#182e3d">DOWNLOAD_</text><text data-role="title" x="322" y="213" font-size="25" font-weight="700" fill="#182e3d">AND_VERIFY_</text><text data-role="title" x="322" y="247" font-size="25" font-weight="700" fill="#182e3d">THE_LATEST_</text><text data-role="title" x="322" y="281" font-size="25" font-weight="700" fill="#182e3d">APPROVED_S</text><text data-role="title" x="322" y="315" font-size="25" font-weight="700" fill="#182e3d">OURCE_