<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>업무 요청 요약기</title>
<style>*{box-sizing:border-box}body{font-family:'Malgun Gothic',sans-serif;background:#F5F8FB;color:#17364A;max-width:1000px;margin:70px auto;padding:24px;word-break:keep-all}h1{font-size:42px}p{line-height:1.7}button,select{font:inherit;padding:12px;border:1px solid #05507D;border-radius:8px;background:#EAF2F8;color:#17364A;margin:5px}table{width:100%;border-collapse:collapse;margin:30px 0}th,td{text-align:left;padding:18px;border-bottom:1px solid #B9CBD8}th{background:#05507D;color:#F5F8FB}button[aria-pressed=true]{background:#05507D;color:#F5F8FB}</style>
<p>AI 코딩 교육 · 가상 예제</p><h1>업무 요청 요약기</h1><h2>전체 6건 · 완료 2건 · 미완료 4건</h2><p>미완료 담당자별: 민지 2건 · 서연 1건 · 준호 1건</p>
<button id="toggle" aria-pressed="false">미완료만 보기</button><label for="owner">담당자</label><select id="owner"><option value="">전체</option></select><button id="reset">초기화</button><p id="count" aria-live="polite"></p>
<table><thead><tr><th>담당자</th><th>업무</th><th>상태</th></tr></thead><tbody id="rows"></tbody></table><p id="empty" hidden>조건에 맞는 업무가 없습니다.</p><p>미완료는 상태가 ‘완료’가 아닌 업무입니다. 이 예제는 네트워크와 AI API를 호출하지 않습니다.</p>
<script>const tasks=[{"담당자": "민지", "업무": "월간 실적 취합", "상태": "진행"}, {"담당자": "준호", "업무": "회의실 예약", "상태": "완료"}, {"담당자": "서연", "업무": "견적 검토", "상태": "대기"}, {"담당자": "민지", "업무": "보고서 초안", "상태": "진행"}, {"담당자": "준호", "업무": "재고 확인", "상태": "대기"}, {"담당자": "서연", "업무": "일정 공유", "상태": "완료"}];const owner=document.getElementById('owner'),button=document.getElementById('toggle');let pending=false;[...new Set(tasks.map(t=>t['담당자']))].sort().forEach(v=>{const o=document.createElement('option');o.textContent=v;o.value=v;owner.append(o)});function render(){const list=tasks.filter(t=>(!pending||t['상태']!=='완료')&&(!owner.value||t['담당자']===owner.value));const rows=document.getElementById('rows');rows.replaceChildren();for(const t of list){const r=document.createElement('tr');for(const k of ['담당자','업무','상태']){const c=document.createElement('td');c.textContent=t[k];r.append(c)}rows.append(r)}document.getElementById('count').textContent='표시 '+list.length+'건';document.getElementById('empty').hidden=list.length>0;button.setAttribute('aria-pressed',String(pending));button.textContent=pending?'전체 상태 보기':'미완료만 보기'}button.onclick=()=>{pending=!pending;render()};owner.onchange=render;document.getElementById('reset').onclick=()=>{pending=false;owner.value='';render()};render();</script></html>
